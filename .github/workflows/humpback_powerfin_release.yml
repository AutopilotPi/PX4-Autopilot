name: Humpback Powerfin Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (for example: humpback-powerfin-v1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark the release as a pre-release'
        required: true
        default: true
        type: boolean

concurrency:
  group: humpback-powerfin-release-${{ inputs.tag_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build and publish Humpback Powerfin
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/px4/px4-dev:v1.16.0-rc1-258-g0369abd556

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build release package
        run: |
          rm -f build/humpback_powerfin_default/px4-*.zip
          make humpback_powerfin release

      - name: Verify release package
        id: package
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(build/humpback_powerfin_default/px4-*.zip)
          if (( ${#archives[@]} != 1 )); then
            echo "Expected exactly one release package, found ${#archives[@]}" >&2
            exit 1
          fi
          archive=${archives[0]}
          test -s "$archive"
          sha256sum "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload package
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: Humpback Powerfin ${{ inputs.tag_name }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.package.outputs.archive }}
